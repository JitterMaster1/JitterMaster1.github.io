<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JitterMaster | Apex Legends Movement Macro</title>
    <!-- サイトのアイコン (favicon) の設定 -->
    <link rel="icon" href="Pageicon.png" type="image/png">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- CSSファイルの読み込み (バージョンを3.6に更新) -->
    <link rel="stylesheet" href="style.css?v=3.6">
    <!-- アイコン用: Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- ヘッダー / ナビゲーション -->
    <header class="navbar">
        <div class="logo">
            <img src="logo.png" alt="JitterMaster Logo" class="logo-img">
            <span class="logo-text">JitterMaster</span>
        </div>
        
        <div class="nav-icons">
            <a href="https://www.youtube.com/@Jitter_Ma_Ster" target="_blank" aria-label="YouTube"><img src="YouTubelogo.png" alt="YouTube" class="nav-social-img"></a>
            <a href="https://x.com/Jitter_Ma_Ster" target="_blank" aria-label="X"><img src="Xlogo.png" alt="X" class="nav-social-img icon-x"></a>
            <a href="https://discord.com/invite/tV4PYUMUQd" target="_blank" aria-label="Discord"><img src="Discordlogo.png" alt="Discord" class="nav-social-img"></a>
        </div>
    </header>

    <!-- ヒーローセクション -->
    <main class="hero">
        <div class="hero-overlay"></div>
        
        <div class="hero-container">
            <!-- 左側：画像セクション (カルーセル) -->
            <div class="hero-image-box" id="software-carousel">
                <img src="software1.png" alt="Preview 1" class="software-img active">
                <img src="software2.png" alt="Preview 2" class="software-img">
                <img src="software3.png" alt="Preview 3" class="software-img">
                
                <div class="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- 右側：コンテンツセクション -->
            <div class="hero-content">
                <h1 id="text-hero-title">Apex Legends <br><span class="highlight" id="text-hero-highlight">Movement Macro</span></h1>
                <p class="description" id="text-hero-desc">
                    Automates strafing in Apex Legends. Simply hold the Space key and press a movement key. Available for purchase below.
                </p>
                
                <!-- ボタンエリア -->
                <div class="cta-group">
                    <div class="cta-top-row">
                        <button id="buy-now-btn" class="btn-primary"><span id="text-btn-buy">Buy Now</span> <i data-lucide="shopping-cart"></i></button>
                        <button id="check-key-btn" class="btn-secondary"><span id="text-btn-check">Check License Key</span> <i data-lucide="key"></i></button>
                    </div>
                    <button class="btn-wide" id="text-btn-learn">Learn More</button>
                </div>

                <!-- 特徴セクション (Driverless, Undetected, Lifetime の順) -->
                <div class="features">
                    <div class="feature-item">
                        <i data-lucide="cpu"></i>
                        <span id="text-feat-driverless">Driverless</span>
                    </div>
                    <div class="feature-item">
                        <i data-lucide="shield-check"></i>
                        <span id="text-feat-undetected">Undetected</span>
                    </div>
                    <div class="feature-item">
                        <i data-lucide="infinity"></i>
                        <span id="text-feat-lifetime">Lifetime</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 言語選択ボックス (画面左下) -->
    <div class="language-selector">
        <i data-lucide="languages"></i>
        <select id="lang-select">
            <option value="en">English</option>
            <option value="ja">日本語</option>
        </select>
    </div>

    <!-- ログイン状態表示 (画面右下) -->
    <footer id="footer-status" class="login-status-footer" style="display: none;">
        <span id="text-status-signed-in">Signed in to Discord as </span><span id="discord-username-display"></span>. 
        <a href="#" id="switch-account-link" class="switch-link">Switch account</a>
    </footer>

    <script>
        lucide.createIcons();

        // サーバーのURL (最新のCloudflare Tunnel URL)
        const API_BASE_URL = 'https://boolean-simulation-inexpensive-heroes.trycloudflare.com';

        // 翻訳データ
        const translations = {
            en: {
                hero_title: "Apex Legends ",
                hero_highlight: "Movement Macro",
                hero_desc: "Automates strafing in Apex Legends. Simply hold the Space key and press a movement key. Available for purchase below.",
                btn_buy: "Buy Now",
                btn_check: "Check License Key",
                btn_learn: "Learn More",
                feat_driverless: "Driverless",
                feat_undetected: "Undetected",
                feat_lifetime: "Lifetime",
                status_signed_in: "Signed in to Discord as ",
                status_switch: "Switch account",
                link_learn_more: "https://discord.com/channels/1325563321155457055/1532950492315910165"
            },
            ja: {
                hero_title: "Apex Legends ",
                hero_highlight: "Movement Macro",
                hero_desc: "スペースキーを長押ししながら移動キーを押すことでストレイフマクロが反応します。下からご購入いただけます。",
                btn_buy: "今すぐ購入",
                btn_check: "ライセンスキーを確認",
                btn_learn: "詳細を見る",
                feat_driverless: "ドライバーレス",
                feat_undetected: "未検地",
                feat_lifetime: "ライフタイム",
                status_signed_in: "Discordログイン中: ",
                status_switch: "アカウントを切り替える",
                link_learn_more: "https://discord.com/channels/1325563321155457055/1532932332300800190"
            }
        };

        const carousel = document.getElementById('software-carousel');
        const images = carousel.querySelectorAll('.software-img');
        const dots = carousel.querySelectorAll('.dot');
        let currentIndex = 0;

        function showImage(index) {
            images.forEach((img, i) => {
                img.classList.toggle('active', i === index);
                dots[i].classList.toggle('active', i === index);
            });
        }

        carousel.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % images.length;
            showImage(currentIndex);
        });

        function updateLanguage(lang) {
            const t = translations[lang];
            if (!t) return;
            document.getElementById('text-hero-title').firstChild.textContent = t.hero_title;
            document.getElementById('text-hero-highlight').innerText = t.hero_highlight;
            document.getElementById('text-hero-desc').innerText = t.hero_desc;
            document.getElementById('text-btn-buy').innerText = t.btn_buy;
            document.getElementById('text-btn-check').innerText = t.btn_check;
            document.getElementById('text-btn-learn').innerText = t.btn_learn;
            document.getElementById('text-feat-driverless').innerText = t.feat_driverless;
            document.getElementById('text-feat-undetected').innerText = t.feat_undetected;
            document.getElementById('text-feat-lifetime').innerText = t.feat_lifetime;
            document.getElementById('text-status-signed-in').innerText = t.status_signed_in;
            document.getElementById('switch-account-link').innerText = t.status_switch;
            
            document.getElementById('lang-select').value = lang;
            localStorage.setItem('preferred-lang', lang);
        }

        async function checkLoginStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/user/status`);
                if (response.ok) {
                    const user = await response.json();
                    if (user && user.username) {
                        document.getElementById('discord-username-display').innerText = user.username;
                        document.getElementById('footer-status').style.display = 'block';
                    }
                }
            } catch (error) {
                console.log('Not logged in');
            }
        }

        function handleAction(action, isSwitch = false) {
            const lang = document.getElementById('lang-select').value;
            let url = `${API_BASE_URL}/auth/discord?action=${action}&lang=${lang}`;
            if (isSwitch) url += '&switch=true';
            window.location.href = url;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferred-lang');
            const browserLang = navigator.language.startsWith('ja') ? 'ja' : 'en';
            const finalLang = savedLang || browserLang;
            
            updateLanguage(finalLang);
            checkLoginStatus();
        });

        document.getElementById('lang-select').addEventListener('change', (e) => {
            updateLanguage(e.target.value);
        });

        document.getElementById('buy-now-btn').addEventListener('click', () => handleAction('buy'));
        document.getElementById('check-key-btn').addEventListener('click', () => handleAction('check'));
        
        // Learn More ボタンの挙動
        document.getElementById('text-btn-learn').addEventListener('click', () => {
            const lang = document.getElementById('lang-select').value;
            window.open(translations[lang].link_learn_more, '_blank');
        });

        document.getElementById('switch-account-link').addEventListener('click', (e) => {
            e.preventDefault();
            handleAction('buy', true);
        });
    </script>
</body>
</html>
